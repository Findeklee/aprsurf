# Beispiel-Konfigurationsdatei für ham-bbs
# Kommentare beginnen mit # oder ;

# Pfad zur SQLite-Datenbank
db_path = /var/ham-bbs/ham-bbs.sqlite3

# APRS/Direwolf Host und Port
aprs_host = 192.168.178.39
aprs_port = 8000

# TCP/Telnet Port
listen_port = 2323

# Name des BBS
bbs_name = AprSurf

# Rufzeichen des Sysops
sysop_callsign = DN9RZ

# Rufzeichen der BBS
bbs_callsign = DN9RZ-10

# Grid Locator, z.B. JO31EG
grid_locator = JO31EG

# Beacon-Intervall in Sekunden (0 = deaktiviert)
beacon_interval = 1200

# Beacon-Text
beacon_text = BBS:telnet 45.92.195.194 2323 or msg HELP

# GPS-Koordinate LAT 
gps_lat = 51.1573

# GPS-Koordinate LON
gps_lon = 6.2200

