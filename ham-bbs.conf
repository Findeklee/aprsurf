# Beispiel-Konfigurationsdatei für ham-bbs
# Kommentare beginnen mit # oder ;

# Pfad zur SQLite-Datenbank
db_path = /var/ham-bbs/ham-bbs.sqlite3

# APRS/Direwolf Host und Port
aprs_host = 192.168.178.39
aprs_port = 8000

# TCP/Telnet Port
listen_port = 2323

# Name des BBS
bbs_name = HamBBS2000

# Rufzeichen des Sysops
sysop_callsign = DN9RZ

# Rufzeichen der BBS
bbs_callsign = DN9RZ-10

# Grid Locator, z.B. JO31EG
grid_locator = JO31EG
